name: Release Python SDK

on:
  push:
    tags: ["sdk-py-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing sdk-py-vX.Y.Z tag
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Validate tag
        id: release
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin main
          version="$(awk '/^\[project\]$/ { in_project=1; next } /^\[/ { in_project=0 } in_project && /^version = / { gsub(/"/, "", $3); print $3; exit }' sdks/python/pyproject.toml)"
          bash tooling/release/validate-tag.sh "${TAG}" sdk-py- "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
        working-directory: sdks/python
      - run: uv run --frozen pytest -c /dev/null --rootdir=. -p no:cacheprovider tests/test_spans.py tests/test_transport.py
        working-directory: sdks/python
      - run: uv build
        working-directory: sdks/python
      - run: uv run --with twine twine check dist/*
        working-directory: sdks/python
      - name: Smoke-test wheel
        working-directory: sdks/python
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          uv venv "${RUNNER_TEMP}/pulse-sdk-wheel"
          uv pip install --python "${RUNNER_TEMP}/pulse-sdk-wheel/bin/python" dist/*.whl
          "${RUNNER_TEMP}/pulse-sdk-wheel/bin/python" -c \
            'import importlib.metadata, os, pulse_sdk; assert importlib.metadata.version("pulse-trace-sdk") == os.environ["EXPECTED_VERSION"]'
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/
