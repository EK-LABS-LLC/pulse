name: Release CLI

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing cli-vX.Y.Z tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin main
          version="${TAG#cli-v}"
          manifest="$(sed -nE 's/^version = "([^"]+)"/\1/p' crates/pulse-cli/Cargo.toml | head -n1)"
          lock="$(awk '$0 == "name = \"pulse\"" { found=1; next } found && /^version = / { gsub(/"/, "", $3); print $3; exit }' Cargo.lock)"
          bash tooling/release/validate-tag.sh "${TAG}" cli- "${manifest}"
          bash tooling/release/require-legacy-bridge.sh cli "${manifest}"
          cmp Cargo.lock crates/pulse-cli/Cargo.lock
          test "${lock}" = "${version}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

  build:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: pulse-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: pulse-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: pulse-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: pulse-darwin-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "${GITHUB_ENV}"
      - run: cargo build --release --package pulse --target ${{ matrix.target }}
      - name: Package binary
        run: |
          cp target/${{ matrix.target }}/release/pulse ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}
          tar -czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: [validate, build]
    environment: release-cli
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          previous="$(git tag --list 'cli-v*' --sort=-v:refname | grep -Fxv "${TAG}" | head -n1 || true)"
          args=(release create "${TAG}" artifacts/**/*.tar.gz --verify-tag --latest=false --generate-notes)
          if [[ -n "${previous}" ]]; then
            args+=(--notes-start-tag "${previous}")
          fi
          gh "${args[@]}"
