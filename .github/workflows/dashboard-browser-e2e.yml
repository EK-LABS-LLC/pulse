name: Dashboard Browser E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-browser-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dashboard:
              - 'apps/dashboard/**'
              - 'apps/server/**'
              - 'packages/api-contracts/**'
              - 'crates/pulse-cli/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'contracts/otel/**'
              - 'Justfile'
              - '.npmrc'
              - 'package.json'
              - 'bun.lock'
              - 'mise.toml'
              - 'tsconfig.base.json'
              - '.github/workflows/dashboard-browser-e2e.yml'

  dashboard-browser-e2e:
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.dashboard == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build --tag pulse-verify:local --file apps/server/Dockerfile .

      - name: Start isolated stack (postgres + server)
        working-directory: apps/dashboard/e2e
        run: |
          docker compose -f e2e-compose.yml up -d --wait
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:39000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f e2e-compose.yml logs pulse
          exit 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - uses: dtolnay/rust-toolchain@stable
      - name: Build the CLI
        run: cargo build --package pulse

      - name: Install Playwright
        working-directory: apps/dashboard/e2e
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Run dashboard browser suite
        working-directory: apps/dashboard/e2e
        env:
          PULSE_E2E_BASE_URL: http://localhost:39000
          PULSE_E2E_SHOT_DIR: screenshots
          PULSE_E2E_CLI: ../../../target/debug/pulse
        run: bunx playwright test

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: apps/dashboard/e2e/screenshots/**/*.png
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/dashboard/e2e/playwright-report/
          if-no-files-found: ignore
