name: Release Server

on:
  push:
    tags: ["server-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing server-vX.Y.Z tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      image_tag: ${{ steps.release.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin main
          version="${TAG#server-v}"
          manifest="$(jq -r .version apps/server/package.json)"
          bash tooling/release/validate-tag.sh "${TAG}" server- "${manifest}"
          bash tooling/release/require-legacy-bridge.sh server "${manifest}"
          {
            echo "tag=${TAG}"
            echo "version=${version}"
            echo "image_tag=v${version}"
          } >> "${GITHUB_OUTPUT}"

  dashboard:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/server build:dashboard-assets
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-assets
          path: apps/server/dist/dashboard
          if-no-files-found: error

  binaries:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            os: linux
            arch: amd64
          - target: bun-linux-arm64
            os: linux
            arch: arm64
          - target: bun-darwin-x64
            os: darwin
            arch: amd64
          - target: bun-darwin-arm64
            os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - run: |
          mkdir -p dist
          bun build ./pulse.ts --compile --target=${{ matrix.target }} \
            --outfile ./dist/pulse-server-${{ matrix.os }}-${{ matrix.arch }}
        working-directory: apps/server
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.os }}-${{ matrix.arch }}
          path: apps/server/dist/pulse-server-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error

  github-release:
    runs-on: ubuntu-latest
    needs: [validate, dashboard, binaries]
    environment: release-server
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: server-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-assets
          path: dist/dashboard
      - name: Package release
        run: |
          tar -czf dist/pulse-dashboard-assets.tar.gz -C dist/dashboard .
          cd dist
          sha256sum pulse-server-* pulse-dashboard-assets.tar.gz > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          previous="$(git tag --list 'server-v*' --sort=-v:refname | grep -Fxv "${TAG}" | head -n1 || true)"
          if [[ -z "${previous}" ]]; then
            previous="$(git tag --list 'service-v*' --sort=-v:refname | head -n1 || true)"
          fi
          args=(release create "${TAG}" dist/pulse-server-* dist/pulse-dashboard-assets.tar.gz dist/checksums.txt --verify-tag --latest=false --generate-notes)
          if [[ -n "${previous}" ]]; then
            args+=(--notes-start-tag "${previous}")
          fi
          gh "${args[@]}"

  image:
    runs-on: ubuntu-latest
    needs: validate
    environment: release-server
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image owner
        id: image
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_OUTPUT}"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/pulse-server:${{ needs.validate.outputs.image_tag }}
            ghcr.io/${{ steps.image.outputs.owner }}/pulse-server:${{ needs.validate.outputs.tag }}
